name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本仓库验证过的版本对齐（见 CONTRIBUTING.md「依赖版本」）
  ARDUINO_CORE: esp32:esp32@3.3.10
  ARDUINO_LIBS: M5Cardputer@1.1.1 M5Unified@0.2.25 M5GFX@0.2.32 ArduinoJson@7.4.3
  SKETCH_DIR: .

jobs:
  # 纯文本/数据自检：不需要工具链，先跑，错了立刻失败
  checks:
    name: Policy checks (holidays · cert chain · generated assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 峰谷节假日表是否覆盖
        run: python3 tools/check-holidays.py

      - name: 证书链是否仍由内置根签发
        run: bash tools/check-cert-chain.sh

      - name: 生成的位图头文件与 assets/*.bin 一致
        run: |
          python3 tools/bin2header.py \
            --input assets/whale_96x96_rgb565.bin \
            --output /tmp/whale_96.h \
            --width 96 --height 96 --name whale_96 --format rgb565
          diff -u src/assets/whale_96.h /tmp/whale_96.h

      - name: Python 工具语法自检
        run: |
          python3 -m py_compile tools/bin2header.py tools/bin2png.py tools/check-holidays.py

      - name: 位图能还原成 PNG（尺寸/字节序自检）
        run: |
          python3 tools/bin2png.py \
            --input assets/whale_96x96_rgb565.bin \
            --output /tmp/whale.png \
            --width 96 --height 96 --format rgb565

  compile:
    name: Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PSRAM enabled · 8M partition"
            board_options: "PSRAM=enabled,PartitionScheme=default_8MB"
          - name: "PSRAM disabled · 8M partition"
            board_options: "PSRAM=disabled,PartitionScheme=default_8MB"
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: 缓存 core 与库
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-${{ env.ARDUINO_CORE }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-${{ env.ARDUINO_CORE }}-

      - name: 安装 esp32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "${ARDUINO_CORE}"

      - name: 安装库
        run: arduino-cli lib install ${ARDUINO_LIBS}

      - name: 编译（--warnings all）
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:m5stack_cardputer:${{ matrix.board_options }}" \
            --warnings all \
            --export-binaries \
            "${SKETCH_DIR}"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: build/**/*.bin
          if-no-files-found: warn
          retention-days: 14
