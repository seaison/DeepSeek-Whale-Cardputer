name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本仓库验证过的版本对齐（见 CONTRIBUTING.md「依赖版本」）
  ARDUINO_CORE: esp32:esp32@3.3.10
  ARDUINO_LIBS: M5Cardputer@1.1.1 M5Unified@0.2.25 M5GFX@0.2.32 ArduinoJson@7.4.3
  SKETCH_DIR: firmware/DeepSeekWhale

jobs:
  # 纯文本/数据自检：不需要工具链，先跑，错了立刻失败
  checks:
    name: Policy checks (holidays · cert chain · generated assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 峰谷节假日表是否覆盖
        run: python3 tools/check-holidays.py

      - name: 证书链是否仍由内置根签发
        run: bash tools/check-cert-chain.sh

      - name: 内置根证书与 tools/certs/*.pem 一致
        run: python3 tools/make-root-ca.py --check

      - name: 生成的位图头文件与 assets/*.bin 一致
        run: |
          python3 tools/bin2header.py \
            --input assets/whale_96x96_rgb565.bin \
            --output /tmp/whale_96.h \
            --width 96 --height 96 --name whale_96 --format rgb565
          diff -u firmware/DeepSeekWhale/src/assets/whale_96.h /tmp/whale_96.h

      - name: Python 工具语法自检
        run: |
          python3 -m py_compile tools/bin2header.py tools/bin2png.py \
            tools/check-holidays.py tools/make-root-ca.py

      - name: 位图能还原成 PNG（尺寸/字节序自检）
        run: |
          python3 tools/bin2png.py \
            --input assets/whale_96x96_rgb565.bin \
            --output /tmp/whale.png \
            --width 96 --height 96 --format rgb565

  # 主机侧单元测试：money / pricing（含与上游实现对拍），不需要工具链
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: golden 与生成器一致（防止手改对拍数据）
        run: |
          node tests/gen-golden.mjs > /tmp/peak.tsv
          diff -u tests/golden/peak-2026.tsv /tmp/peak.tsv

      - name: 跑单元测试
        run: bash tests/run.sh
        env:
          CXX: g++

  compile:
    name: Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [checks, native-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PSRAM enabled · 8M partition"
            board_options: "PSRAM=enabled,PartitionScheme=default_8MB"
          - name: "PSRAM disabled · 8M partition"
            board_options: "PSRAM=disabled,PartitionScheme=default_8MB"
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2.0.0

      - name: 缓存 core 与库
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-${{ env.ARDUINO_CORE }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-${{ env.ARDUINO_CORE }}-

      - name: 安装 esp32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "${ARDUINO_CORE}"

      - name: 安装库
        run: arduino-cli lib install ${ARDUINO_LIBS}

      - name: 中英文案字形检查（英文必须纯 ASCII / 中文必须命中 efont 字库）
        run: python3 tools/check-cjk-font.py --strict

      - name: 编译（--warnings all）
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:m5stack_cardputer:${{ matrix.board_options }}" \
            --warnings all \
            --export-binaries \
            "${SKETCH_DIR}"

      - name: 上传固件
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ strategy.job-index }}
          path: firmware/DeepSeekWhale/build/**/*.bin
          if-no-files-found: warn
          retention-days: 14
